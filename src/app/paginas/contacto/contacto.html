<!-- Contenedor principal de la pagina -->
<section class="pagina-contacto">
  <h1>Contactanos</h1>
  <p>Tienes alguna duda, sugerencia o evento especial? Escribenos.</p>

  <!-- Aviso de confirmacion cuando el formulario se envia -->
  @if (enviado()) {
    <p class="mensaje-exito">
      Tu mensaje ha sido enviado con exito. Te responderemos pronto.
    </p>
  }

  <!-- Formulario reactivo -->
  <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <!-- Campo nombre -->
    <label>
      Nombre completo
      <input type="text" formControlName="nombre" placeholder="Tu nombre" />
      @if (invalido('nombre')) {
        <small>Ingresa tu nombre (minimo 3 caracteres).</small>
      }
    </label>

    <!-- Campo correo -->
    <label>
      Correo electronico
      <input type="email" formControlName="correo" placeholder="correo@ejemplo.com" />
      @if (invalido('correo')) {
        <small>Ingresa un correo electronico valido.</small>
      }
    </label>

    <!-- Campo mensaje -->
    <label>
      Mensaje
      <textarea formControlName="mensaje" rows="4" placeholder="Escribe tu mensaje aqui..."></textarea>
      @if (invalido('mensaje')) {
        <small>El mensaje debe tener al menos 10 caracteres.</small>
      }
    </label>

    <!-- Boton de envio -->
    <button type="submit">Enviar mensaje</button>
  </form>
</section>
